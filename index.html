<script>
(function(){
  var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(!isMobile) return;
  function openApp(appUrl, webUrl){
    var opened = false;
    function onVis(){ if(document.hidden) opened = true; }
    document.addEventListener('visibilitychange', onVis);
    window.addEventListener('pagehide', function(){ opened = true; });
    window.location.href = appUrl;
    setTimeout(function(){
      document.removeEventListener('visibilitychange', onVis);
      if(!opened && !document.hidden) window.open(webUrl, '_blank', 'noopener');
    }, 1500);
  }
  var yt = document.querySelector('a.lk.yt'), fb = document.querySelector('a.lk.fb');
  if(yt) yt.addEventListener('click', function(e){
    e.preventDefault();
    openApp('vnd.youtube://www.youtube.com/channel/UC1zIx_ZdOYUfk5fKfvY8hog', 'https://www.youtube.com/channel/UC1zIx_ZdOYUfk5fKfvY8hog');
  });
  if(fb) fb.addEventListener('click', function(e){
    e.preventDefault();
    openApp('fb://facewebmodal/f?href=https://www.facebook.com/BarmagetElBakaloria', 'https://www.facebook.com/BarmagetElBakaloria');
  });
})();
</script>
<script>
document.addEventListener('click', function(e){
  var o = e.target.closest('.qa .opt'); if(!o) return;
  var qa = o.closest('.qa'); if(!qa || qa.dataset.done) return;
  if(o.dataset.c){ o.classList.add('sel'); qa.dataset.done = '1'; }
  else { o.classList.add('bad'); setTimeout(function(){ o.classList.remove('bad'); }, 700); }
});
</script>
<script>
