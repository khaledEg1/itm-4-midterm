<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Cat on a sofa</title>
  <desc id="desc">A cute orange cat resting on a cozy sofa.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5efe7"/>
      <stop offset="100%" stop-color="#e8d9c2"/>
    </linearGradient>
    <linearGradient id="sofa" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#8b6f5b"/>
      <stop offset="100%" stop-color="#6d5245"/>
    </linearGradient>
    <linearGradient id="cushion" x1="0" x2="1">
      <stop offset="0%" stop-color="#d8b38e"/>
      <stop offset="100%" stop-color="#b98a67"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Floor shadow -->
  <ellipse cx="600" cy="700" rx="420" ry="60" fill="#c4b09b" opacity="0.32"/>

  <!-- Sofa -->
  <rect x="220" y="360" width="760" height="260" rx="30" fill="url(#sofa)"/>
  <rect x="250" y="320" width="700" height="90" rx="24" fill="#a27d69"/>
  <rect x="270" y="410" width="220" height="155" rx="18" fill="url(#cushion)"/>
  <rect x="510" y="410" width="220" height="155" rx="18" fill="url(#cushion)"/>
  <rect x="750" y="410" width="200" height="155" rx="18" fill="url(#cushion)"/>
  <rect x="260" y="300" width="700" height="30" rx="15" fill="#765d4d" opacity="0.6"/>

  <!-- Armrests -->
  <rect x="200" y="395" width="70" height="160" rx="18" fill="#7c5d4a"/>
  <rect x="930" y="395" width="70" height="160" rx="18" fill="#7c5d4a"/>

  <!-- Cat body -->
  <ellipse cx="610" cy="505" rx="170" ry="130" fill="#f3a24b"/>
  <ellipse cx="610" cy="485" rx="120" ry="95" fill="#f7b15f" opacity="0.9"/>

  <!-- Head -->
  <circle cx="610" cy="350" r="96" fill="#f3a24b"/>
  <circle cx="565" cy="340" r="18" fill="#2d2a2f"/>
  <circle cx="655" cy="340" r="18" fill="#2d2a2f"/>
  <circle cx="558" cy="334" r="6" fill="#f5f5f5"/>
  <circle cx="648" cy="334" r="6" fill="#f5f5f5"/>

  <!-- Ears -->
  <path d="M530 270 L565 205 L585 270 Z" fill="#f3a24b"/>
  <path d="M690 270 L655 205 L635 270 Z" fill="#f3a24b"/>
  <path d="M540 255 L565 220 L575 255 Z" fill="#f7d2a2"/>
  <path d="M660 255 L635 220 L625 255 Z" fill="#f7d2a2"/>

  <!-- Nose and whiskers -->
  <path d="M610 360 L590 385 L610 400 L630 385 Z" fill="#f38a83"/>
  <path d="M505 380 Q560 365 582 385" stroke="#3b373c" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M715 380 Q660 365 638 385" stroke="#3b373c" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M497 405 Q560 392 585 410" stroke="#f9f1eb" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M523 420 Q565 408 590 420" stroke="#f9f1eb" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M703 405 Q640 392 615 410" stroke="#f9f1eb" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M677 420 Q635 408 610 420" stroke="#f9f1eb" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Mouth -->
  <path d="M595 395 Q610 415 625 395" stroke="#b75c52" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Paw pads and paws -->
  <ellipse cx="490" cy="600" rx="58" ry="42" fill="#f7d4a5"/>
  <ellipse cx="678" cy="600" rx="58" ry="42" fill="#f7d4a5"/>
  <ellipse cx="548" cy="625" rx="38" ry="28" fill="#f7d4a5"/>
  <ellipse cx="670" cy="625" rx="38" ry="28" fill="#f7d4a5"/>

  <!-- Tail -->
  <path d="M775 460 C860 445, 900 500, 890 570" stroke="#f3a24b" stroke-width="26" fill="none" stroke-linecap="round"/>
  <path d="M884 568 C923 560, 945 585, 940 610" stroke="#f3a24b" stroke-width="20" fill="none" stroke-linecap="round"/>

  <!-- Cushion details -->
  <line x1="260" y1="430" x2="470" y2="430" stroke="#d9a878" stroke-width="10" opacity="0.65"/>
  <line x1="720" y1="430" x2="960" y2="430" stroke="#d9a878" stroke-width="10" opacity="0.65"/>
  <line x1="500" y1="430" x2="700" y2="430" stroke="#d9a878" stroke-width="10" opacity="0.65"/>

  <!-- Small plant accent -->
  <ellipse cx="1080" cy="300" rx="60" ry="18" fill="#d7d3d0" opacity="0.8"/>
  <path d="M1078 288 C1058 248, 1048 220, 1078 182 C1110 220, 1106 247, 1080 288 Z" fill="#7cbf82"/>
  <path d="M1080 298 C1108 268, 1130 248, 1144 220 C1115 220, 1098 238, 1080 298 Z" fill="#78b97e"/>
  <path d="M1080 298 C1052 268, 1033 248, 1015 220 C1044 220, 1062 238, 1080 298 Z" fill="#6ba56f"/>
  <rect x="1066" y="300" width="28" height="64" rx="12" fill="#7a5f45"/>
</svg>
